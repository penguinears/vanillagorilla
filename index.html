<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Vanilla Gorilla</title>

<link rel="icon" type="image/png" href="images/goggg-removebg-preview.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    font-family:sans-serif;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

img{
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

#scene{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#3aa0ff;
}

/* INTRO */

#gorillaIntro{
    position:absolute;
    width:min(240px,45vw);
    bottom:-220px;
    left:-220px;
    transform:rotate(25deg);
    opacity:0;
    animation:flyIntro 4s ease-out forwards;
    animation-delay:0.3s;
    z-index:6;
}

@keyframes flyIntro{
    0%{
        bottom:-220px;
        left:-220px;
        opacity:1;
    }

    100%{
        bottom:100vh;
        left:100vw;
        opacity:0;
    }
}

#vanillaText{
    position:absolute;
    top:50%;
    left:50%;
    width:94vw;
    max-width:700px;
    text-align:center;
    transform:translate(-50%,-50%) scale(0.1) rotate(-180deg);
    font-size:clamp(2rem,8vw,3.2rem);
    line-height:1;
    color:#fff;
    opacity:0;
    white-space:nowrap;
    animation:vanillaSpin 2.5s ease-out forwards;
    animation-delay:2s;
    z-index:6;
}

@keyframes vanillaSpin{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0.1) rotate(-180deg);
    }

    30%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1) rotate(10deg);
    }

    60%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0deg);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0.9) rotate(20deg);
    }
}

/* BLACK CUTSCENE OVERLAY */

#overlay{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    font-size:clamp(1.2rem,5vw,1.6rem);
    opacity:0;
    pointer-events:none;
    z-index:7;
    transition:opacity 0.6s;
}

#overlayText{
    padding:10px 20px;
}

/* GAME LAYER */

#gameLayer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#3aa0ff;
    display:block;
    overflow:hidden;
    z-index:3;
}

#worldStack{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:200%;
    height:200dvh;
    transition:transform 0s;
}

#gameWorld{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
}

/* PLAYER */

#player{
    position:absolute;
    width:115px;
    left:150px;
    top:50%;
    transform:translateY(-50%) rotate(0deg);
    transition:none !important;
    z-index:4;
    display:none;
}

/* OBJECTS */

.plane{
    position:absolute;
    width:130px;
    height:auto;
    z-index:3;
}

.banana{
    position:absolute;
    width:55px;
    height:auto;
    z-index:3;
}

/* MEGA WAVE */

#megaWaveBanner{
    position:absolute;
    top:50%;
    left:50%;
    width:92vw;
    max-width:650px;
    height:auto;
    max-height:45vh;
    max-height:45dvh;
    object-fit:contain;
    transform:translate(-50%,-50%);
    z-index:8;
    display:none;
}

.mega-shake{
    animation:megaShake 0.6s linear infinite;
}

@keyframes megaShake{

    0%{
        transform:translate(-50%,-50%) translateX(-4px);
    }

    25%{
        transform:translate(-50%,-50%) translateX(4px);
    }

    50%{
        transform:translate(-50%,-50%) translateX(-4px);
    }

    75%{
        transform:translate(-50%,-50%) translateX(4px);
    }

    100%{
        transform:translate(-50%,-50%) translateX(0);
    }

}

/* HUD */

#score{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:max(15px,env(safe-area-inset-left));
    font-size:clamp(1.1rem,5vw,1.6rem);
    font-weight:700;
    color:#fff;
    z-index:5;
}

#bananaCount{
    position:absolute;
    top:clamp(40px,7vh,48px);
    left:max(15px,env(safe-area-inset-left));
    font-size:clamp(0.9rem,4vw,1.3rem);
    color:#ffe066;
    z-index:5;
    display:flex;
    align-items:center;
    gap:5px;
}

#bananaCount img{
    width:clamp(20px,7vw,26px);
    height:auto;
}

#hearts{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    right:max(15px,env(safe-area-inset-right));
    font-size:clamp(1.1rem,5vw,1.6rem);
    z-index:5;
}

/* PAUSE */

#pauseBtn{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(1.4rem,6vw,1.8rem);
    color:#fff;
    cursor:pointer;
    z-index:6;
    display:none;
}

/* DEATH SCREEN */

#deathScreen{
    position:absolute;
    left:0;
    top:100vh;
    top:100dvh;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:#3aa0ff;
    overflow:hidden;
}

#deathGround{
    position:absolute;
    bottom:-2px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    height:55vh;
    height:55dvh;
    min-height:420px;
    background-image:url('images/dead gor.png');
    background-size:100% 100%;
    background-position:bottom center;
    background-repeat:no-repeat;
    z-index:2;
}

#deathText{
    position:absolute;
    top:max(40px,10vh);
    left:50%;
    width:90%;
    transform:translateX(-50%);
    color:#fff;
    text-align:center;
    z-index:3;
}

#deathText h1{
    font-size:clamp(1.7rem,8vw,2.2rem);
    margin-bottom:8px;
}

#deathText p{
    font-size:clamp(1rem,5vw,1.3rem);
    margin:3px 0;
}

#restartBtn{
    margin-top:14px;
    padding:8px 16px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    border:2px solid #fff;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
}

/* SHOP BUTTON */

#shopButton{
    position:absolute;
    bottom:max(14px,env(safe-area-inset-bottom));
    right:max(14px,env(safe-area-inset-right));
    width:clamp(55px,17vw,70px);
    height:auto;
    cursor:pointer;
    z-index:4;
    pointer-events:auto;
}

/* SHOP OVERLAY */

#shopOverlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:9;
}

#shopPanel{
    background:#111;
    border:2px solid #444;
    border-radius:10px;
    padding:14px 18px;
    width:min(90vw,420px);
    max-height:90vh;
    max-height:90dvh;
    overflow:hidden;
    color:#fff;
    text-align:center;
    position:relative;
}

#shopTitle{
    font-size:clamp(1.3rem,6vw,1.6rem);
    margin-bottom:8px;
}

#shopSkinImage{
    width:min(180px,42vw);
    max-height:38vh;
    object-fit:contain;
    height:auto;
    display:block;
    margin:0 auto 8px auto;
}

#shopInfo{
    margin-bottom:8px;
    font-size:clamp(0.95rem,4vw,1.1rem);
}

.shop-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    border-radius:4px;
    border:2px solid #fff;
    background:#000;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:1.2rem;
}

#shopPrev{
    left:8px;
}

#shopNext{
    right:8px;
}

#shopActionBtn{
    margin-top:5px;
    padding:6px 14px;
    border-radius:4px;
    border:2px solid #fff;
    background:#222;
    color:#fff;
    cursor:pointer;
}

#shopLock{
    margin-top:4px;
    font-size:1rem;
}

#shopClose{
    position:absolute;
    top:6px;
    right:8px;
    cursor:pointer;
    font-size:1.1rem;
    color:#aaa;
}

/* SMALL PHONE */

@media(max-width:420px){

    #player{
        width:92px;
        left:18vw;
    }

    .plane{
        width:110px;
    }

    .banana{
        width:45px;
    }

    #megaWaveBanner{
        width:90vw;
        max-height:38vh;
        max-height:38dvh;
    }

    #shopPanel{
        padding:12px 15px;
    }

}

/* VERY SHORT SCREENS */

@media(max-height:500px){

    #bananaCount{
        top:36px;
    }

    #shopPanel{
        padding:8px 15px;
    }

    #shopSkinImage{
        width:110px;
        max-height:28vh;
        max-height:28dvh;
    }

    #deathText{
        top:25px;
    }

}

/* LANDSCAPE MOBILE */

@media(max-height:500px) and (orientation:landscape){

    #player{
        width:82px;
    }

    .plane{
        width:115px;
    }

    #megaWaveBanner{
        width:65vw;
        max-height:65vh;
        max-height:65dvh;
    }

    #shopSkinImage{
        width:100px;
        max-height:25vh;
        max-height:25dvh;
    }

}

</style>

<script>

const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");
const gorillaIntro = document.getElementById("gorillaIntro");
const vanillaText = document.getElementById("vanillaText");

const gameLayer = document.getElementById("gameLayer");
const worldStack = document.getElementById("worldStack");
const gameWorld = document.getElementById("gameWorld");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const heartsEl = document.getElementById("hearts");

const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");

const scoreLine = document.getElementById("scoreLine");
const bestScoreLine = document.getElementById("bestScoreLine");

const bananaText = document.getElementById("bananaText");
const bananaLine = document.getElementById("bananaLine");

const megaWaveBanner =
    document.getElementById("megaWaveBanner");

const shopButton =
    document.getElementById("shopButton");

const shopOverlay =
    document.getElementById("shopOverlay");

const shopSkinImage =
    document.getElementById("shopSkinImage");

const shopInfo =
    document.getElementById("shopInfo");

const shopLock =
    document.getElementById("shopLock");

const shopActionBtn =
    document.getElementById("shopActionBtn");

const shopPrev =
    document.getElementById("shopPrev");

const shopNext =
    document.getElementById("shopNext");

const shopClose =
    document.getElementById("shopClose");

const isPC =
    !/Android|iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );

/* PLAYER SIZE */

function setPlayerSize(){

    if(!isPC){

        player.style.width =
            window.innerWidth <= 420
                ? "92px"
                : "105px";

        player.style.left =
            window.innerWidth <= 420
                ? "18vw"
                : "90px";

    }else{

        player.style.width = "115px";
        player.style.left = "150px";

    }

}

setPlayerSize();

/* GAME MOVEMENT */

let y = window.innerHeight / 2;
let velocity = 0;

/* Responsive but still close to the original */

let baseFlapStrengthPC = -8.0;
let baseFlapStrengthMobile = -7.4;

let baseGravityPC = 0.205;
let baseGravityMobile = 0.29;

let flapStrength =
    isPC
        ? baseFlapStrengthPC
        : baseFlapStrengthMobile;

let gravity =
    isPC
        ? baseGravityPC
        : baseGravityMobile;

let started = false;
let running = false;
let paused = false;

let inDeathFall = false;
let allowInput = false;

let planes = [];
let bananas = [];

let planeSpawnTimer = 0;
let safeFrames = 0;
let score = 0;
let scoreTimer = 0;
let lives = 3;

let middleTimer = 0;
let diveFrames = 0;

let bananaSpawnTimer = 0;

let bestScore =
    parseInt(
        localStorage.getItem("vg_best_score") || "0",
        10
    );

let bananasTotal =
    parseInt(
        localStorage.getItem("vg_bananas") || "0",
        10
    );

bananaText.textContent =
    "Bananas: " + bananasTotal;

let comboCount = 0;
let lastGapFrame = 0;
let frameCounter = 0;
let planePassCount = 0;

let inMegaWave = false;
let megaWaveActive = false;
let firstMegaDone = false;
let lastMegaScoreTrigger = 0;

/* SKINS */

const SKINS = [

    {
        id:"vanilla",
        name:"Vanilla Gorilla",
        price:0,
        unlocked:true,
        icon:"images/goggg-removebg-preview.png",
        fly:"images/gor2-removebg-preview.png",
        fall:"images/gor3-removebg-preview.png",
        dead:"images/dead gor.png"
    },

    {
        id:"spider",
        name:"Spider Gorilla",
        price:100,
        unlocked:false,
        icon:"images/flyspider-removebg-preview.png",
        fly:"images/flyspider-removebg-preview.png",
        fall:"images/flyspider-removebg-preview.png",
        dead:"images/spider-removebg-preview.png"
    }

];

let ownedSkinsJSON =
    localStorage.getItem("vg_owned_skins");

let ownedSkins =
    ownedSkinsJSON
        ? JSON.parse(ownedSkinsJSON)
        : ["vanilla"];

SKINS.forEach(s => {

    if(ownedSkins.includes(s.id)){
        s.unlocked = true;
    }

});

let currentSkinId =
    localStorage.getItem("vg_current_skin")
    || "vanilla";

if(!ownedSkins.includes(currentSkinId)){
    currentSkinId = "vanilla";
}

function getCurrentSkin(){

    return (
        SKINS.find(
            s => s.id === currentSkinId
        )
        || SKINS[0]
    );

}

let shopIndex = 0;

function applyCurrentSkin(
    falling=false,
    dead=false
){

    const skin = getCurrentSkin();

    if(dead){

        player.src = skin.dead;

    }else if(falling){

        player.src = skin.fall;

        if(skin.id === "spider"){

            player.style.transformOrigin =
                "center center";

        }

    }else{

        player.src = skin.fly;

    }

}

applyCurrentSkin(false,false);

/* REMOVE TRANSPARENT SPACE FROM SHIP.PNG */

function trimTransparentImage(img){

    if(img.dataset.trimmed === "1"){
        return;
    }

    if(!img.complete || !img.naturalWidth){
        return;
    }

    img.dataset.trimmed = "1";

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");

    const width = img.naturalWidth;
    const height = img.naturalHeight;

    canvas.width = width;
    canvas.height = height;

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );

    let data;

    try{

        data =
            ctx.getImageData(
                0,
                0,
                width,
                height
            ).data;

    }catch(e){

        return;

    }

    let minX = width;
    let minY = height;
    let maxX = -1;
    let maxY = -1;

    for(let yy=0;yy<height;yy++){

        for(let xx=0;xx<width;xx++){

            const alpha =
                data[
                    (yy * width + xx) * 4 + 3
                ];

            if(alpha > 10){

                if(xx < minX) minX = xx;
                if(xx > maxX) maxX = xx;
                if(yy < minY) minY = yy;
                if(yy > maxY) maxY = yy;

            }

        }

    }

    if(maxX < minX || maxY < minY){
        return;
    }

    const cropWidth =
        maxX - minX + 1;

    const cropHeight =
        maxY - minY + 1;

    if(
        cropWidth === width &&
        cropHeight === height
    ){
        return;
    }

    canvas.width = cropWidth;
    canvas.height = cropHeight;

    ctx.clearRect(
        0,
        0,
        cropWidth,
        cropHeight
    );

    ctx.drawImage(
        img,
        minX,
        minY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );

    try{

        img.src =
            canvas.toDataURL("image/png");

    }catch(e){

        img.dataset.trimmed = "0";

    }

}

function preparePlane(plane){

    plane.addEventListener(
        "load",
        function(){

            trimTransparentImage(plane);

        },
        {once:false}
    );

    if(plane.complete){
        trimTransparentImage(plane);
    }

}

/* RESIZE */

window.addEventListener(
    "resize",
    () => {

        setPlayerSize();

        if(!running && !inDeathFall){

            y =
                window.innerHeight / 2;

            player.style.top =
                y + "px";

        }

    }
);

/* INPUT */

document.addEventListener(
    "keydown",
    e => {

        if(
            ["Space","ArrowUp","KeyW"]
                .includes(e.code)
        ){

            e.preventDefault();

            flap(e);

        }

    }
);

document.addEventListener(
    "mousedown",
    e => {

        flap(e);

    }
);

document.addEventListener(
    "touchstart",
    e => {

        if(e.target.closest(".ui")){
            return;
        }

        e.preventDefault();

        flap(e);

    },
    {passive:false}
);

function flap(e){

    if(
        e &&
        e.target &&
        e.target.classList &&
        e.target.classList.contains("ui")
    ){
        return;
    }

    if(inDeathFall) return;

    if(!allowInput) return;

    if(!running){

        startGameplay();

        return;

    }

    if(paused) return;

    started = true;

    velocity = flapStrength;

}

/* HEARTS */

function updateHearts(){

    heartsEl.textContent =
        "❤️".repeat(lives);

}

/* BONUS TEXT */

function flashBonus(
    text,
    color="yellow"
){

    const b =
        document.createElement("div");

    b.textContent = text;

    b.style.position =
        "absolute";

    b.style.left =
        "18%";

    b.style.top =
        (y - 40) + "px";

    b.style.color =
        color;

    b.style.fontSize =
        "clamp(1rem,5vw,1.4rem)";

    b.style.fontWeight =
        "700";

    b.style.zIndex =
        "10";

    b.style.opacity =
        "1";

    b.style.transition =
        "1s";

    gameWorld.appendChild(b);

    setTimeout(
        () => {

            b.style.opacity = "0";

            b.style.top =
                (y - 80) + "px";

        },
        50
    );

    setTimeout(
        () => b.remove(),
        1100
    );

}

/* SCREEN SHAKE */

function screenShake(){

    document.body.style.transition =
        "0s";

    document.body.style.transform =
        "translate(8px)";

    setTimeout(
        () => {

            document.body.style.transform =
                "translate(-8px)";

        },
        60
    );

    setTimeout(
        () => {

            document.body.style.transform =
                "translate(0)";

        },
        120
    );

}

/* PLANES / SHIPS */

/*
 * Find a vertical position that is not too close
 * to another plane near the spawn side.
 */

function getSafePlaneY(){

    const topMargin = 25;
    const bottomMargin = 190;

    const maxY =
        Math.max(
            topMargin + 30,
            window.innerHeight - bottomMargin
        );

    const minGap = 125;

    for(let attempt = 0; attempt < 50; attempt++){

        const candidate =
            topMargin +
            Math.random() *
            Math.max(
                30,
                maxY - topMargin
            );

        let safe = true;

        for(const other of planes){

            const otherLeft =
                parseFloat(
                    other.style.left
                );

            /*
             * Only worry about planes that are still
             * near the spawning side. Planes far away
             * cannot visually overlap the new plane.
             */

            if(
                isNaN(otherLeft) ||
                otherLeft < window.innerWidth - 260
            ){
                continue;
            }

            const otherTop =
                parseFloat(
                    other.style.top
                );

            if(
                !isNaN(otherTop) &&
                Math.abs(
                    candidate - otherTop
                ) < minGap
            ){

                safe = false;
                break;

            }

        }

        if(safe){
            return candidate;
        }

    }

    /*
     * If the screen is already too crowded,
     * don't create another plane.
     * This guarantees planes don't spawn
     * directly on top of each other.
     */

    return null;

}

function spawnPlane(isMega=false){

    let maxPlanes =
        isMega
            ? 14
            : Math.min(
                7,
                2 + Math.floor(
                    safeFrames / 350
                )
            );

    if(
        planes.length >= maxPlanes
    ){
        return;
    }

    const yPos =
        getSafePlaneY();

    if(yPos === null){
        return;
    }

    const plane =
        document.createElement("img");

    plane.src =
        "images/ship.png";

    plane.className =
        "plane";

    plane.style.top =
        yPos + "px";

    plane.style.left =
        window.innerWidth + "px";

    /*
     * Smaller than the previous version,
     * especially on phones.
     */

    plane.style.width =
        isPC
            ? "130px"
            : (
                window.innerWidth <= 420
                    ? "110px"
                    : "118px"
            );

    let baseSpeed;

    if(isMega){

        baseSpeed =
            3.4 +
            Math.random() * 5.2;

    }else{

        baseSpeed =
            2.4 +
            Math.random() * 2.6 +
            Math.min(
                3.0,
                safeFrames / 300
            );

    }

    if(!isPC){

        baseSpeed *= 0.95;

    }else{

        baseSpeed *= 1.18;

    }

    /*
     * Every plane gets its own speed.
     * This stops every plane moving like
     * an identical wall.
     */

    const personalSpeed =
        0.88 +
        Math.random() * 0.42;

    plane.dataset.speed =
        baseSpeed * personalSpeed;

    gameWorld.appendChild(
        plane
    );

    planes.push(plane);

    preparePlane(plane);

}

/* BANANAS */

function spawnBanana(){

    const banana =
        document.createElement("img");

    banana.src =
        "images/bbb-removebg-preview.png";

    banana.className =
        "banana";

    const minY = 60;

    const maxY =
        Math.max(
            minY + 20,
            window.innerHeight - 240
        );

    let yPos =
        Math.random() *
        (maxY - minY) +
        minY;

    banana.style.top =
        yPos + "px";

    banana.style.left =
        window.innerWidth + "px";

    let speed =
        2.6 +
        Math.random() * 1.2 +
        Math.min(
            2.0,
            safeFrames / 350
        );

    if(!isPC){

        speed *= 0.8;

    }

    banana.dataset.speed =
        speed;

    gameWorld.appendChild(
        banana
    );

    bananas.push(banana);

}

/* COLLISION */

function hit(a,b){

    const ar =
        a.getBoundingClientRect();

    const br =
        b.getBoundingClientRect();

    const playerPadX =
        ar.width * 0.10;

    const playerPadY =
        ar.height * 0.10;

    const shipPadX =
        br.width * 0.08;

    const shipPadY =
        br.height * 0.08;

    return !(
        ar.right - playerPadX <
            br.left + shipPadX ||

        ar.left + playerPadX >
            br.right - shipPadX ||

        ar.bottom - playerPadY <
            br.top + shipPadY ||

        ar.top + playerPadY >
            br.bottom - shipPadY
    );

}

function hitBanana(a,b){

    const ar =
        a.getBoundingClientRect();

    const br =
        b.getBoundingClientRect();

    const shrink = 10;

    return !(
        ar.right - shrink <
            br.left + shrink ||

        ar.left + shrink >
            br.right - shrink ||

        ar.bottom - shrink <
            br.top + shrink ||

        ar.top + shrink >
            br.bottom - shrink
    );

}

/* SCORE */

function updateScoreDisplay(){

    if(score > bestScore){

        scoreEl.style.color =
            "yellow";

        scoreEl.innerHTML =
            '<i class="fa-solid fa-crown" style="color:rgb(255,212,59);margin-right:6px;"></i> Score: ' +
            score;

    }else{

        scoreEl.style.color =
            "#fff";

        scoreEl.textContent =
            "Score: " + score;

    }

}

/* MEGA WAVE */

function startMegaWave(){

    if(megaWaveActive){
        return;
    }

    megaWaveActive = true;

    inMegaWave = true;

    megaWaveBanner.style.display =
        "block";

    megaWaveBanner.classList.add(
        "mega-shake"
    );

    let originalFlap =
        flapStrength;

    let originalGrav =
        gravity;

    flapStrength =
        originalFlap * 1.2;

    gravity =
        originalGrav * 1.2;

    for(let i=0;i<12;i++){

        setTimeout(
            () => {

                spawnPlane(true);

            },
            i * 120
        );

    }

    setTimeout(
        () => {

            megaWaveBanner.style.display =
                "none";

            megaWaveBanner.classList.remove(
                "mega-shake"
            );

            flapStrength =
                originalFlap;

            gravity =
                originalGrav;

            inMegaWave = false;

            megaWaveActive = false;

        },
        3000
    );

}

/* MAIN GAME LOOP */

function gameLoop(){

    if(!running || paused){
        return;
    }

    frameCounter++;
    safeFrames++;

    velocity += gravity;

    y += velocity;

    let gorillaHeight =
        player.offsetHeight || 70;

    if(y < 0){

        y = 0;

        velocity = 0;

    }

    if(
        y >
        window.innerHeight -
        gorillaHeight +
        10
    ){

        y =
            window.innerHeight -
            gorillaHeight +
            10;

        triggerDeath();

        return;

    }

    player.style.top =
        y + "px";

    /*
     * STRONG GORILLA LEAN
     *
     * The physics stay quick and responsive,
     * while the visual rotation is much stronger.
     */

    let angle =
        velocity * 7.2;

    angle =
        Math.max(
            -55,
            Math.min(
                55,
                angle
            )
        );

    player.style.transform =
        'translateY(-50%) rotate(' +
        angle +
        'deg)';

    if(velocity > 4){

        diveFrames++;

        if(diveFrames > 12){

            applyCurrentSkin(
                true,
                false
            );

        }

    }else{

        diveFrames = 0;

        applyCurrentSkin(
            false,
            false
        );

    }

    if(started){

        const midTop =
            window.innerHeight * 0.40;

        const midBottom =
            window.innerHeight * 0.60;

        if(
            y > midTop &&
            y < midBottom
        ){

            middleTimer++;

            if(middleTimer >= 60){

                score += 2;

                flashBonus(
                    "CENTER +2"
                );

                middleTimer = 0;

                updateScoreDisplay();

            }

        }else{

            middleTimer = 0;

        }

    }

    if(
        started &&
        safeFrames > 100 &&
        !inMegaWave
    ){

        planeSpawnTimer++;

        if(
            planeSpawnTimer >
            Math.max(
                44,
                125 -
                safeFrames / 10
            )
        ){

            planeSpawnTimer = 0;

            spawnPlane(false);

        }

    }

    if(
        started &&
        safeFrames > 200
    ){

        bananaSpawnTimer++;

        if(
            bananaSpawnTimer > 120
        ){

            bananaSpawnTimer = 0;

            if(Math.random() < 0.7){

                spawnBanana();

            }

        }

    }

    if(
        frameCounter -
        lastGapFrame >
        180
    ){

        comboCount = 0;

    }

    /* SHIP MOVEMENT */

    for(
        let i = planes.length - 1;
        i >= 0;
        i--
    ){

        const p = planes[i];

        /*
         * Each plane has its own speed.
         */

        let left =
            parseFloat(
                p.style.left
            ) -
            parseFloat(
                p.dataset.speed
            );

        p.style.left =
            left + "px";

        if(
            left < 150 &&
            left > 20 &&
            !p.bonusGiven
        ){

            p.bonusGiven = true;

            const gorCenter =
                y;

            const planeCenter =
                parseFloat(
                    p.style.top
                ) +
                p.offsetHeight / 2;

            const gap =
                Math.abs(
                    gorCenter -
                    planeCenter
                );

            let gotGood = false;

            if(gap < 40){

                score += 10;

                flashBonus(
                    "NARROW FIT +10",
                    "orange"
                );

                gotGood = true;

            }else if(gap < 100){

                score += 5;

                flashBonus(
                    "GOOD GAP +5",
                    "yellow"
                );

                gotGood = true;

            }else if(gap < 160){

                score += 2;

                flashBonus(
                    "NEAR MISS +2",
                    "#9cf"
                );

                gotGood = true;

            }

            if(gotGood){

                comboCount++;

                lastGapFrame =
                    frameCounter;

                if(comboCount === 3){

                    score += 5;

                    flashBonus(
                        "COMBO x3 +5",
                        "lime"
                    );

                }else if(
                    comboCount === 5
                ){

                    score += 10;

                    flashBonus(
                        "COMBO x5 +10",
                        "lime"
                    );

                }

                updateScoreDisplay();

            }else{

                comboCount = 0;

            }

            planePassCount++;

        }

        if(left < -300){

            p.remove();

            planes.splice(
                i,
                1
            );

            continue;

        }

        if(hit(player,p)){

            screenShake();

            lives--;

            updateHearts();

            p.remove();

            planes.splice(
                i,
                1
            );

            comboCount = 0;

            if(lives <= 0){

                triggerDeath();

                return;

            }

        }

    }

    /* BANANA MOVEMENT */

    for(
        let i = bananas.length - 1;
        i >= 0;
        i--
    ){

        const b = bananas[i];

        let left =
            parseFloat(
                b.style.left
            ) -
            parseFloat(
                b.dataset.speed
            );

        b.style.left =
            left + "px";

        if(left < -200){

            b.remove();

            bananas.splice(
                i,
                1
            );

            continue;

        }

        if(hitBanana(player,b)){

            bananasTotal++;

            localStorage.setItem(
                "vg_bananas",
                String(bananasTotal)
            );

            bananaText.textContent =
                "Bananas: " +
                bananasTotal;

            flashBonus(
                "+1 banana",
                "gold"
            );

            b.remove();

            bananas.splice(
                i,
                1
            );

        }

    }

    /* SCORE TIMER / MEGA WAVE */

    if(started){

        scoreTimer++;

        if(scoreTimer >= 14){

            scoreTimer = 0;

            score++;

            updateScoreDisplay();

            if(
                !firstMegaDone &&
                score >= 220
            ){

                firstMegaDone = true;

                lastMegaScoreTrigger =
                    220;

                startMegaWave();

            }else if(
                firstMegaDone &&
                score >= 220 &&
                (score - 220) % 200 === 0 &&
                score !== lastMegaScoreTrigger
            ){

                if(Math.random() < 0.5){

                    lastMegaScoreTrigger =
                        score;

                    startMegaWave();

                }

            }

        }

    }

    requestAnimationFrame(
        gameLoop
    );

}

/* DEATH */

function triggerDeath(){

    if(!running){
        return;
    }

    running = false;
    paused = false;
    started = false;
    inDeathFall = true;
    allowInput = false;

    screenShake();

    applyCurrentSkin(
        true,
        false
    );

    let dv = 0;

    function fall(){

        dv += 0.9;

        y += dv;

        player.style.top =
            y + "px";

        /*
         * Strong downward death lean.
         */

        player.style.transform =
            'translateY(-50%) rotate(48deg)';

        if(
            y <
            window.innerHeight + 160
        ){

            requestAnimationFrame(
                fall
            );

        }else{

            showDeathScreen();

        }

    }

    fall();

}

/* DEATH SCREEN */

function showDeathScreen(){

    inDeathFall = false;

    allowInput = false;

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "vg_best_score",
            String(bestScore)
        );

    }

    const msgs = [

        "You died L bozo",
        "How r u so bad",
        "My grandma can play better than u"

    ];

    document.querySelector(
        "#deathText h1"
    ).textContent =
        msgs[
            Math.floor(
                Math.random() *
                msgs.length
            )
        ];

    scoreLine.textContent =
        "Score: " + score;

    bestScoreLine.textContent =
        "Best Score: " + bestScore;

    bananaLine.textContent =
        "Bananas: " + bananasTotal;

    player.style.display =
        "none";

    worldStack.style.transition =
        "transform 2s ease-in";

    worldStack.style.transform =
        "translateY(-100vh)";

}

/* RESTART */

restartBtn.onclick = () => {

    allowInput = false;

    worldStack.style.transition =
        "transform 1s ease-out";

    worldStack.style.transform =
        "translateY(0)";

    setTimeout(
        () => {

            planes.forEach(
                p => p.remove()
            );

            planes = [];

            bananas.forEach(
                b => b.remove()
            );

            bananas = [];

            y =
                window.innerHeight / 2;

            velocity = 0;

            started = false;
            running = false;
            paused = false;
            inDeathFall = false;

            score = 0;
            scoreTimer = 0;
            safeFrames = 0;

            lives = 3;

            middleTimer = 0;
            diveFrames = 0;
            bananaSpawnTimer = 0;

            comboCount = 0;
            lastGapFrame = 0;
            frameCounter = 0;
            planePassCount = 0;

            inMegaWave = false;
            megaWaveActive = false;
            firstMegaDone = false;
            lastMegaScoreTrigger = 0;

            updateHearts();

            applyCurrentSkin(
                false,
                false
            );

            player.style.display =
                "block";

            player.style.top =
                y + "px";

            player.style.transform =
                "translateY(-50%) rotate(0deg)";

            setPlayerSize();

            scoreEl.style.color =
                "#fff";

            scoreEl.textContent =
                "Score: 0";

            pauseBtn.style.display =
                "none";

            overlay.style.opacity =
                0;

            overlay.style.pointerEvents =
                "none";

            allowInput = true;

        },
        900
    );

};

/* PAUSE */

pauseBtn.onclick = () => {

    if(!running){
        return;
    }

    paused = !paused;

    pauseBtn.innerHTML =
        paused

            ? '<i class="fa-solid fa-play" style="color:rgb(30,48,80);"></i>'

            : '<i class="fa-solid fa-pause" style="color:rgb(30,48,80);"></i>';

    if(!paused){

        requestAnimationFrame(
            gameLoop
        );

    }

};

/* START GAME */

function startGameplay(){

    overlay.style.opacity =
        "0";

    overlay.style.pointerEvents =
        "none";

    started = false;
    running = true;
    paused = false;
    inDeathFall = false;

    y =
        window.innerHeight / 2;

    velocity = 0;

    score = 0;
    scoreTimer = 0;
    safeFrames = 0;

    lives = 3;

    middleTimer = 0;
    diveFrames = 0;
    bananaSpawnTimer = 0;

    comboCount = 0;
    lastGapFrame = 0;
    frameCounter = 0;
    planePassCount = 0;

    inMegaWave = false;
    megaWaveActive = false;
    firstMegaDone = false;
    lastMegaScoreTrigger = 0;

    updateHearts();

    planes.forEach(
        p => p.remove()
    );

    planes = [];

    bananas.forEach(
        b => b.remove()
    );

    bananas = [];

    scoreEl.style.color =
        "#fff";

    scoreEl.textContent =
        "Score: 0";

    applyCurrentSkin(
        false,
        false
    );

    player.style.display =
        "block";

    player.style.top =
        y + "px";

    player.style.transform =
        "translateY(-50%) rotate(0deg)";

    setPlayerSize();

    pauseBtn.style.display =
        "block";

    pauseBtn.innerHTML =
        '<i class="fa-solid fa-pause" style="color:rgb(30,48,80);"></i>';

    requestAnimationFrame(
        gameLoop
    );

}

/* INTRO / CUTSCENE */

function runFirstTimeIntro(){

    allowInput = false;

    player.style.display =
        "none";

    setTimeout(
        () => {

            overlayText.textContent =
                "Survive the skies.";

            overlay.style.opacity =
                1;

            overlay.style.pointerEvents =
                "none";

        },
        7000
    );

    setTimeout(
        () => {

            overlay.style.opacity =
                0;

            overlay.style.pointerEvents =
                "none";

            player.style.display =
                "block";

            player.style.top =
                y + "px";

            player.style.transform =
                "translateY(-50%) rotate(0deg)";

            setPlayerSize();

            allowInput = true;

            localStorage.setItem(
                "vg_seen_intro",
                "1"
            );

        },
        7000 + 2500
    );

}

function skipIntroShowIdle(){

    gorillaIntro.style.display =
        "none";

    vanillaText.style.display =
        "none";

    overlay.style.opacity =
        0;

    overlay.style.pointerEvents =
        "none";

    player.style.display =
        "block";

    player.style.top =
        y + "px";

    player.style.transform =
        "translateY(-50%) rotate(0deg)";

    setPlayerSize();

    allowInput = true;

}

const seenIntro =
    localStorage.getItem(
        "vg_seen_intro"
    ) === "1";

if(seenIntro){

    skipIntroShowIdle();

}else{

    runFirstTimeIntro();

}

/* SHOP LOGIC */

function updateShopUI(){

    const skin =
        SKINS[shopIndex];

    shopSkinImage.src =
        skin.icon;

    shopInfo.textContent =
        skin.name +
        " - " +
        skin.price +
        " bananas";

    if(skin.unlocked){

        shopLock.textContent =
            "";

        if(
            currentSkinId ===
            skin.id
        ){

            shopActionBtn.textContent =
                "Equipped";

            shopActionBtn.disabled =
                true;

        }else{

            shopActionBtn.textContent =
                "Equip";

            shopActionBtn.disabled =
                false;

        }

    }else{

        shopLock.textContent =
            "Locked";

        shopActionBtn.textContent =
            "Buy";

        shopActionBtn.disabled =
            false;

    }

}

shopButton.onclick = () => {

    shopOverlay.style.display =
        "flex";

    updateShopUI();

};

shopClose.onclick = () => {

    shopOverlay.style.display =
        "none";

};

shopPrev.onclick = () => {

    shopIndex =
        (
            shopIndex -
            1 +
            SKINS.length
        ) %
        SKINS.length;

    updateShopUI();

};

shopNext.onclick = () => {

    shopIndex =
        (
            shopIndex +
            1
        ) %
        SKINS.length;

    updateShopUI();

};

shopActionBtn.onclick = () => {

    const skin =
        SKINS[shopIndex];

    if(skin.unlocked){

        currentSkinId =
            skin.id;

        localStorage.setItem(
            "vg_current_skin",
            currentSkinId
        );

        applyCurrentSkin(
            false,
            false
        );

        updateShopUI();

    }else{

        if(
            bananasTotal >=
            skin.price
        ){

            bananasTotal -=
                skin.price;

            bananaText.textContent =
                "Bananas: " +
                bananasTotal;

            localStorage.setItem(
                "vg_bananas",
                String(bananasTotal)
            );

            skin.unlocked = true;

            if(
                !ownedSkins.includes(
                    skin.id
                )
            ){

                ownedSkins.push(
                    skin.id
                );

                localStorage.setItem(
                    "vg_owned_skins",
                    JSON.stringify(
                        ownedSkins
                    )
                );

            }

            updateShopUI();

        }

    }

};
